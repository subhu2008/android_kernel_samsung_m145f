name: Build SM-M145F (Galaxy M14 4G) Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: write
    env:
      USE_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl flex gcc git \
            libelf-dev libssl-dev lld llvm clang \
            python3 python3-pip rsync zip unzip \
            dwarves pahole device-tree-compiler \
            libncurses-dev busybox cpio \
            libselinux1-dev openssl gawk p7zip-full git

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure Git identity
        run: |
          git config --global user.name "Subham Nayak"
          git config --global user.email "fstab.subhu@gmail.com"

      - name: Build SM-M145F (Galaxy M14 4G) kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Prune old ccache entries
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="ccache-${RUNNER_OS}-${{ github.ref_name }}-"
          gh cache list --key "$prefix" --limit 100 --json id,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[1:] | .[].id' |
            xargs -r -n1 gh cache delete

      - name: Generate SHA-256 checksum
        run: sha256sum boot.img > SHA256SUM.txt

      - name: Attest boot.img
        uses: actions/attest@v4
        with:
          subject-path: ./boot.img

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-M145F
          path: |
            boot.img
            SHA256SUM.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ./boot.img \
            ./SHA256SUM.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
